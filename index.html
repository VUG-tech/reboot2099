<style>
:root{--bg:#06041a;--bg2:#0d0a35;--pink:#ff2bd6;--cyan:#00f0ff;--ink:#e8eeff;--dim:#8f9bc4;--sc:#ff2bd6;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{min-height:100vh;color:var(--ink);font-family:'Rajdhani',system-ui,sans-serif;overflow-x:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 36px;
 background:radial-gradient(900px 600px at 50% 0%,#1a0f55 0%,#0d0a35 45%,#06041a 100%) fixed}
body:before{content:'';position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 5px)}
body:after{content:'';position:fixed;left:0;right:0;height:120px;top:-120px;pointer-events:none;z-index:49;background:linear-gradient(transparent,rgba(0,240,255,.10),transparent);animation:sweep 6s linear infinite}
@keyframes sweep{to{transform:translateY(calc(100vh + 240px))}}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;font-family:'Share Tech Mono',monospace;font-size:13px;letter-spacing:.14em;color:var(--cyan);text-shadow:0 0 8px var(--cyan)}
.live{color:var(--pink);text-shadow:0 0 8px var(--pink)}.live:before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pink);margin-right:8px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.boot{font-family:'Share Tech Mono',monospace;font-size:14px;letter-spacing:.08em;color:var(--cyan);min-height:92px;line-height:1.7}
.boot .ok{color:#4dff9a}.boot .no{color:var(--pink)}
.card{display:none;flex-direction:column;gap:18px;animation:in .8s ease both}
.card.show{display:flex}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero{position:relative;display:flex;align-items:center;justify-content:center;height:250px}
.hero svg{position:absolute;inset:0;margin:auto;width:250px;height:250px}
.r1{transform-origin:125px 125px;animation:spin 18s linear infinite}.r2{transform-origin:125px 125px;animation:spin 11s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{transform-origin:125px 125px;animation:pulse 2.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(.55);opacity:.8}100%{transform:scale(1.05);opacity:0}}
.sil{width:116px;height:116px;position:relative;z-index:2;filter:drop-shadow(0 0 10px var(--sc))}
.name{position:relative;text-align:center;font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(40px,13vw,64px);letter-spacing:.03em;color:#fff;text-shadow:0 0 16px var(--sc),0 0 40px var(--sc),-3px 0 0 var(--cyan),3px 0 0 var(--pink);animation:gl 4s infinite}
@keyframes gl{0%,92%,100%{transform:none;text-shadow:0 0 16px var(--sc),0 0 40px var(--sc),-3px 0 0 var(--cyan),3px 0 0 var(--pink)}93%{transform:translateX(-5px);text-shadow:4px 0 0 var(--cyan),-4px 0 0 var(--pink)}95%{transform:translateX(4px) skewX(-6deg)}97%{transform:translateX(-2px)}}
.sub{text-align:center;font-family:'Share Tech Mono',monospace;font-size:13px;letter-spacing:.3em;color:var(--dim);margin-top:-8px}
.panel{background:rgba(8,6,30,.78);border:2px solid var(--sc);box-shadow:0 0 20px color-mix(in srgb,var(--sc) 35%,transparent),inset 0 0 24px color-mix(in srgb,var(--sc) 10%,transparent);padding:18px 20px;
 clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px))}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px}
.k{font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:.24em;color:var(--cyan)}
.v{font-weight:700;font-size:28px;line-height:1.1;color:#fff;margin-top:2px;min-width:0;overflow-wrap:anywhere}
.v.big{font-family:'Orbitron',sans-serif;font-weight:900;font-size:34px;color:var(--sc);text-shadow:0 0 12px var(--sc)}
.mono{font-family:'Share Tech Mono',monospace;letter-spacing:.2em}
.tag{font-size:19px;line-height:1.35;color:var(--ink);font-weight:500}
.wave{height:54px;width:100%;display:block}
.wave path{fill:none;stroke:var(--sc);stroke-width:2.5;stroke-linejoin:round;filter:drop-shadow(0 0 5px var(--sc))}
.wv{animation:wv 3s linear infinite}
@keyframes wv{to{transform:translateX(-200px)}}
.tick{overflow:hidden;white-space:nowrap;border-top:1px dashed color-mix(in srgb,var(--cyan) 55%,transparent);border-bottom:1px dashed color-mix(in srgb,var(--cyan) 55%,transparent);padding:7px 0;font-family:'Share Tech Mono',monospace;font-size:13px;letter-spacing:.2em;color:var(--dim)}
.tick span{display:inline-block;animation:tk 22s linear infinite}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.foot{text-align:center;font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:.2em;color:var(--dim)}
.foot b{color:var(--pink);font-weight:400}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
</style>
